<!doctype html>
<html lang="en" class="dark" data-theme="toru" style="color-scheme: dark; background: #0b0c0f">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/irori.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Irori</title>
    <script>
      // Card #232: when the opening screen first painted, for the start log.
      window.__iroriSplashAt = performance.now()
    </script>
  </head>
  <body style="margin: 0; background: #0b0c0f">
    <!-- Card #232: the opening screen. Plain markup, so it paints with the
         page, before any script runs; React replaces it once the Core has
         started (main.tsx waits for it). -->
    <div id="root">
      <div
        id="irori-opening"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          color: #b4b8c2;
        "
      >
        <img src="/irori.svg" width="64" height="64" alt="" />
        <div id="irori-opening-text" style="font-size: 15px">Opening Irori…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
