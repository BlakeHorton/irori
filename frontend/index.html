<!doctype html>
<!-- Card #266: Irori's own design system; #275: themes. The markup is the
     default (Blue, Frost glass, dark); the script below applies the saved
     choice before the first paint. design/irori-ds.css and themes.css
     paint the page and its backdrop. -->
<html lang="en" class="dark" data-ds="irori" data-theme="blue" data-glass="frost" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/irori.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Irori</title>
    <script>
      // Card #275: the saved appearance (src/lib/appearance.ts, storeKey),
      // applied before anything paints. The lists are checked against
      // appearance.ts by appearance.test.ts.
      ;(function () {
        try {
          var a = JSON.parse(localStorage.getItem("irori.appearance") || "null")
          if (!a) return
          var themes = ["blue", "hearth", "midnight", "forest", "sakura", "mono"]
          var glasses = ["frost", "clear", "milk", "rim", "ember", "liquid"]
          var h = document.documentElement
          var custom = a.theme === "custom" && typeof a.css === "string"
          if (custom) {
            var st = document.createElement("style")
            st.id = "irori-custom-theme"
            st.textContent = a.css
            document.head.appendChild(st)
            h.dataset.theme = "custom"
          } else if (themes.indexOf(a.theme) >= 0) {
            h.dataset.theme = a.theme
          }
          if (glasses.indexOf(a.glass) >= 0) h.dataset.glass = a.glass
          var dark =
            a.mode === "light"
              ? false
              : a.mode === "system"
                ? matchMedia("(prefers-color-scheme: dark)").matches
                : true
          h.classList.toggle("dark", dark)
          h.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {
          // A broken entry leaves the default look.
        }
      })()
      // Card #232: when the opening screen first painted, for the start log.
      window.__iroriSplashAt = performance.now()
    </script>
  </head>
  <body style="margin: 0">
    <!-- Card #232: the opening screen. Plain markup, so it paints with the
         page, before any script runs; React replaces it once the Core has
         started (main.tsx waits for it). -->
    <div id="root">
      <div
        id="irori-opening"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          color: var(--muted-foreground);
        "
      >
        <img src="/irori.svg" width="64" height="64" alt="" />
        <div id="irori-opening-text" style="font-size: 15px">Opening Irori…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
